name: Lifed Morning Brief Cloud Scheduler

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Indian Standard Time, UTC+5:30)
    # Adjust this cron expression to match your local timezone if needed
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI at any time

jobs:
  send-morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cloud Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv

      - name: Dispatch Morning Brief to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m backend.app.notifications.cloud_morning_brief
